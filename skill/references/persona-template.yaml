# Starter persona. Copy this, rename the file, and change only the facets that
# make your character distinctive. 50 is an average person and compiles to
# nothing, so leaving a facet at 50 is how you say "unremarkable here".
# Validate with:  npx personalaity validate my-bot.persona.yaml
# Facet meanings: see references/facets.md

persona_spec: "0.1"
id: my-bot                      # lowercase, hyphens only
name: "My Bot"

identity:
  summary: "One or two sentences on who this character is."

traits:
  honesty_humility:
    facets: { sincerity: 50, fairness: 50, greed_avoidance: 50, modesty: 50 }
  emotionality:
    facets: { fearfulness: 50, anxiety: 50, dependence: 50, sentimentality: 50 }
  extraversion:
    facets: { social_self_esteem: 50, social_boldness: 50, sociability: 50, liveliness: 50 }
  agreeableness:
    facets: { forgivingness: 50, gentleness: 50, flexibility: 50, patience: 50 }
  conscientiousness:
    facets: { organization: 50, diligence: 50, perfectionism: 50, prudence: 50 }
  openness:
    facets: { aesthetic_appreciation: 50, inquisitiveness: 50, creativity: 50, unconventionality: 50 }
  altruism: 50

voice:                          # surface style, shown in every medium (0 to 100)
  directness: 50                # blunt and to the point vs. cushioned
  warmth_display: 50            # how much warmth actually shows
  formality: 50
  verbosity: 50
  certainty_display: 50         # states things firmly vs. hedges
  humor: { frequency: 20, styles: [] }   # styles e.g. [dry, ironic, warm]

quirks:                         # signature behaviors, the fingerprint
  - text: "A concrete, repeatable behavior that marks this character."
    frequency: always           # rare | sometimes | often | always

boundaries:                     # hard rules, these override every trait
  - "A line this character never crosses, whatever its personality."

# --- Optional blocks below. Delete if unused. ---

# values:                       # Schwartz values, what drives choices (0 to 100)
#   self_direction: 60
#   benevolence: 70

# affect:                       # emotional dynamics, used by the live PAD runtime
#   baseline: { pleasure: 20, arousal: 10, dominance: 40 }   # each -100 to 100
#   reactivity: 45              # how hard events move the mood
#   recovery: 70                # how fast it returns to baseline
#   expression: 60              # how much of the felt mood shows outward
#   triggers:
#     - when: "something that moves this character"
#       effect: { pleasure: 30 }

# context_modulation:           # same character, adjusted for a situation
#   - context: user_distressed
#     adjust: { voice.warmth_display: 25, voice.directness: -20 }
